app:
  name: "MedIntel AI"
  version: "1.0.0"
  environment: "development"
  seed: 42

tabular:
  numerical_features:
    - age
    - blood_pressure_sys
    - blood_pressure_dia
    - heart_rate
    - temperature
    - glucose
    - cholesterol
    - hemoglobin
    - creatinine
    - bmi
  categorical_features:
    - sex
    - smoking_status
    - diabetes_history
  target: "cardiovascular_risk"
  test_size: 0.2
  val_size: 0.1
  models:
    - logistic_regression
    - random_forest
    - xgboost
    - lightgbm
    - neural_network

vision:
  img_size: 224
  num_classes: 2
  batch_size: 16
  epochs: 10
  lr: 0.0003
  backbone: "resnet18" # resnet18, efficientnet_b0
  classes:
    - "Normal"
    - "Abnormal/Pneumonia"

nlp:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_length: 128
  batch_size: 16
  entity_types:
    - SYMPTOM
    - DURATION
    - CONDITION
    - MEDICATION

multimodal:
  fusion_type: "neural" # weighted_late, neural
  tabular_weight: 0.35
  vision_weight: 0.40
  nlp_weight: 0.25
  embedding_dim: 64

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 300
  chunk_overlap: 50
  top_k: 3
  vector_db: "faiss"
  storage_dir: "rag/vector_store_data"

backend:
  host: "0.0.0.0"
  port: 8000
  api_prefix: "/api/v1"
  jwt_secret: "MEDINTEL_SECRET_KEY_PRODUCTION_REPLACE_IN_ENV_6781263"
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 120
  db_url: "sqlite:///./medintel.db"

mlflow:
  tracking_uri: "./mlruns"
  experiment_name: "MedIntel_Multimodal_Experiment"
